[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "lm_deluge"
version = "0.0.143"
authors = [{ name = "Benjamin Anderson", email = "ben@trytaylor.ai" }]
description = "Python utility for using LLM API models."
readme = "README.md"
requires-python = ">=3.10"
keywords = []
license = { text = "" }
classifiers = []
dependencies = [
    "pyjson5",
    "PyYAML",
    "aiohttp",
    "xxhash==3.6.0",
    "tqdm",
    "pydantic",
    "markdownify-rs==0.1.5",
    "pillow>=12.3.0",
    "rich",
    "filetype==1.2.0"
]

[project.optional-dependencies]
pdf = ["pdf2image"]
aws = ["boto3>=1.43.35", "urllib3>=2.7.0"]
google = ["google-auth", "cryptography>=48.0.1", "pyasn1>=0.6.4"]
docker = ["docker>=7.0.0", "urllib3>=2.7.0"]
pybubble = ["pybubble; platform_system == 'Linux' and python_version >= '3.12'"]
full_text_search = ["tantivy>=0.21.0", "lenlp>=0.1.0"]
vector_db = ["numpy>=1.24.0"]
sandbox = ["boto3>=1.43.35", "modal>=0.64.0", "daytona-sdk>=0.1.4", "docker>=7.0.0", "pybubble; platform_system == 'Linux' and python_version >= '3.12'", "urllib3>=2.7.0", "multipart>=1.3.1", "cbor2>5.8.0"]
server = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "starlette>=1.3.1"]
dev = ["ty", "pre-commit"]

[project.scripts]
deluge = "lm_deluge.cli:main"
deluge-server = "lm_deluge.server.__main__:main"

[tool.setuptools.package-data]
lm_deluge = ["skill/*.md"]
